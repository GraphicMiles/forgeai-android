plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

android {
    namespace = "ai.luna.app"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "ai.luna.app"
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        // arm64-v8a only. Every phone shipping since 2017 is arm64, and dropping
        // x86_64 (emulator-only) halves the native payload.
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake {
                arguments "-DGGML_NATIVE=OFF", "-DLLAMA_BUILD_APP=OFF", "-DLLAMA_BUILD_TESTS=OFF",
                          "-DLLAMA_BUILD_EXAMPLES=OFF", "-DLLAMA_OPENSSL=OFF", "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildTypes {
        debug {
            ndk { debugSymbolLevel "none" }
        }
        release {
            // The release build is signed with the debug key so CI can produce an
            // installable artifact; swap in a real keystore before shipping.
            signingConfig = signingConfigs.debug
            // Nothing is shrunk: JGit-style reflection and the JNI bridge are
            // easy to break, and 27 MiB leaves plenty of room under the budget.
            minifyEnabled = false
            shrinkResources = false
            ndk { debugSymbolLevel "none" }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
}
