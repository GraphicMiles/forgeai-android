plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

// The upload key. Three ways in, in order: a key.properties file next to the
// Gradle build for local signing, environment variables for CI, and nothing at
// all — in which case the release build falls back to the debug key so a fork
// or a clean checkout still produces an installable APK.
def signingProps = new Properties()
def signingPropsFile = rootProject.file("key.properties")
if (signingPropsFile.exists()) {
    signingPropsFile.withReader("UTF-8") { reader -> signingProps.load(reader) }
}

def signingValue = { String propKey, String envKey, String fallback ->
    def value = signingProps.getProperty(propKey) ?: System.getenv(envKey)
    return (value == null || value.trim().isEmpty()) ? fallback : value.trim()
}

def keystorePath = signingValue("storeFile", "LUNA_KEYSTORE_FILE", null)
def keystoreFile = keystorePath == null ? null : rootProject.file(keystorePath)
def hasUploadKey = keystoreFile != null && keystoreFile.exists()

android {
    namespace = "ai.luna.app"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "ai.luna.app"
        // 24, not 23: Android 6 can only verify a v1 (JAR) signature, and the
        // release APK is signed v2/v3. A phone that cannot run a local model is
        // not the phone this is for anyway.
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        // arm64-v8a only. Every phone shipping since 2017 is arm64, and dropping
        // x86_64 (emulator-only) halves the native payload.
        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake {
                // arm64 only here too: without it CMake still configures v7a,
                // where llama.cpp's fp16 NEON intrinsics do not compile.
                abiFilters "arm64-v8a"
                arguments "-DGGML_NATIVE=OFF", "-DLLAMA_BUILD_APP=OFF", "-DLLAMA_BUILD_TESTS=OFF",
                          "-DLLAMA_BUILD_EXAMPLES=OFF", "-DLLAMA_OPENSSL=OFF", "-DANDROID_STL=c++_shared",
                          "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--gc-sections -Wl,--exclude-libs,ALL -Wl,-s"
                // Size, not speed of compilation: the whole APK has to stay
                // under 50 MiB unpacked.
                cppFlags "-Os", "-fvisibility=hidden", "-ffunction-sections", "-fdata-sections"
                cFlags "-Os", "-ffunction-sections", "-fdata-sections"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        if (hasUploadKey) {
            create("upload") {
                storeFile = keystoreFile
                storePassword = signingValue("storePassword", "LUNA_KEYSTORE_PASSWORD", "")
                keyAlias = signingValue("keyAlias", "LUNA_KEY_ALIAS", "luna")
                keyPassword = signingValue("keyPassword", "LUNA_KEY_PASSWORD", "")
                // v2 and v3 only: everything from Android 7 up verifies those.
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            ndk { debugSymbolLevel "none" }
        }
        release {
            // Signed with the upload key when one is present, and with the debug
            // key when it is not, so a build never silently produces something
            // that cannot be installed.
            signingConfig = hasUploadKey ? signingConfigs.getByName("upload") : signingConfigs.debug
            // Nothing is shrunk: JGit-style reflection and the JNI bridge are
            // easy to break, and 27 MiB leaves plenty of room under the budget.
            minifyEnabled = false
            shrinkResources = false
            ndk { debugSymbolLevel "none" }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
    // Git as a library: Android has no git binary, so JGit (pure Java) does
    // the work in-process. slf4j-nop silences the "no provider" warning.
    implementation "org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r"
    implementation "org.slf4j:slf4j-nop:2.0.13"
}
