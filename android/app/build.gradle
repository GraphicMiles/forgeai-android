plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.luna.app'
    compileSdk 35
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "ai.luna.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // arm64-v8a only: every phone shipping since 2017 is arm64, and dropping
        // x86_64 (emulator-only) halves the native payload.
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DGGML_NATIVE=OFF', '-DLLAMA_BUILD_APP=OFF', '-DLLAMA_BUILD_TESTS=OFF', '-DLLAMA_BUILD_EXAMPLES=OFF', '-DLLAMA_OPENSSL=OFF' }
        }
    }

    packaging {
        // Default AGP behaviour strips the .so symbol tables; only trim packaged metadata here.
        resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', '**/*.proto'] }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    buildTypes {
        debug {
            ndk { debugSymbolLevel 'none' }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation project(':capacitor-android')
    implementation project(':luna-device-capacity')
}

apply from: 'capacitor.build.gradle'
