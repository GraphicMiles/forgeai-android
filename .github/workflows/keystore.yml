name: Create the release keystore

# Run once, by hand. It makes the upload key Luna is signed with and hands it
# back encrypted, because artifacts on a public repository are public.
#
# The passwords come from repository secrets, so they are never printed:
#   LUNA_KEYSTORE_PASSWORD    the store password
#   LUNA_KEY_PASSWORD         the key password
#   LUNA_KEYSTORE_TRANSPORT   the passphrase the artifact is encrypted with
#
# Afterwards the keystore is stored as ANDROID_KEYSTORE_BASE64 and the
# artifact is deleted. Losing this file means never being able to update an
# installed copy of Luna, so keep it somewhere you will still have in a year.

on:
  workflow_dispatch:
  push:
    branches: [keystore-once]

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the key
        env:
          STORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -alias luna \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -keystore luna-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Luna, OU=Luna, O=GraphicMiles, L=Lagos, C=NG"
          keytool -list -v -keystore luna-release.jks -storepass "$STORE_PASSWORD" \
            | grep -E "Alias name|Valid from|SHA256:" || true

      - name: Encrypt it for transport
        env:
          TRANSPORT: ${{ secrets.LUNA_KEYSTORE_TRANSPORT }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in luna-release.jks -out luna-release.jks.enc -pass env:TRANSPORT
          rm luna-release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: luna-keystore-encrypted
          path: luna-release.jks.enc
          retention-days: 1
          if-no-files-found: error
