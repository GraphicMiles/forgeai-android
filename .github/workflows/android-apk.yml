name: Android APK

on:
  push:
    branches: [luna-rebuild, main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2
  APK_UNPACKED_LIMIT_MIB: 50

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          java -version

      - name: Fetch llama.cpp
        run: bash scripts/bootstrap-llama-cpp.sh

      - name: Install NDK 26.1.10909125
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Engine logic tests
        run: bash scripts/logic-tests.sh

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/luna-release.jks
            echo "LUNA_KEYSTORE_FILE=luna-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret. Falling back to the debug key."
          fi

      - name: Build release APK
        env:
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
          LUNA_KEY_ALIAS: luna
        run: flutter build apk --release --target-platform android-arm64 --tree-shake-icons

      - name: Report who signed it
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs --verbose \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/luna-release.jks

      - name: Check the unpacked size budget
        run: |
          set -euo pipefail
          python3 scripts/apk-size.py build/app/outputs/flutter-apk/app-release.apk "$APK_UNPACKED_LIMIT_MIB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
