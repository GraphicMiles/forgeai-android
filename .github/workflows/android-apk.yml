name: Android APK

on:
  push:
    branches: [luna-rebuild, main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2
  APK_UNPACKED_LIMIT_MIB: 50

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          java -version

      - name: Fetch llama.cpp
        run: bash scripts/bootstrap-llama-cpp.sh

      - name: Install NDK 26.1.10909125
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --tree-shake-icons

      - name: Check the unpacked size budget
        run: |
          set -euo pipefail
          python3 scripts/apk-size.py build/app/outputs/flutter-apk/app-release.apk "$APK_UNPACKED_LIMIT_MIB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
