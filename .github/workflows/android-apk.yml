name: Android APK

on:
  push:
    branches: [luna-rebuild, main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2
  APK_UNPACKED_LIMIT_MIB: 50

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          java -version

      - name: Fetch llama.cpp
        run: bash scripts/bootstrap-llama-cpp.sh

      - name: Install NDK 26.1.10909125
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --tree-shake-icons

      - name: Check the unpacked size budget
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"

          unzip -l "$APK" > /tmp/listing.txt
          UNPACKED=$(awk '/^ *[0-9]+ /{total += $1} END {print total+0}' /tmp/listing.txt)
          COMPRESSED=$(stat -c%s "$APK")
          LIMIT=$(( APK_UNPACKED_LIMIT_MIB * 1024 * 1024 ))

          MIB() { awk -v b="$1" 'BEGIN {printf "%.2f", b / 1048576}'; }

          {
            echo "## APK"
            echo ""
            echo "| Measure | Size |"
            echo "| --- | --- |"
            echo "| Download (compressed) | $(MIB "$COMPRESSED") MiB |"
            echo "| Installed (unpacked) | $(MIB "$UNPACKED") MiB |"
            echo "| Budget | ${APK_UNPACKED_LIMIT_MIB}.00 MiB |"
            echo ""
            echo "### Ten largest entries"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          awk '/^ *[0-9]+ /{printf "%12d  %s\n", $1, $4}' /tmp/listing.txt > /tmp/entries.txt
          sort -rn /tmp/entries.txt > /tmp/sorted.txt
          head -n 20 /tmp/sorted.txt > /tmp/top.txt
          cat /tmp/top.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "Twenty largest entries:"
          cat /tmp/top.txt

          if [ "$UNPACKED" -gt "$LIMIT" ]; then
            echo "Unpacked APK is $(MIB "$UNPACKED") MiB, over the ${APK_UNPACKED_LIMIT_MIB} MiB budget." >&2
            exit 1
          fi
          echo "Unpacked APK is $(MIB "$UNPACKED") MiB, within the ${APK_UNPACKED_LIMIT_MIB} MiB budget."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
