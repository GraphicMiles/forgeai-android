name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - luna-rebuild

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  # Hard ceiling: the APK's contents, uncompressed, must stay under this.
  APK_UNPACKED_LIMIT_MIB: "50"
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096m
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2

jobs:
  build-android:
    name: Build Luna Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        run: npm ci

      # Downloads the exact llama.cpp revision required by the CMake project
      # and verifies Java/SDK/NDK/CMake before the expensive build begins.
      - name: Bootstrap pinned llama.cpp
        run: npm run llama:bootstrap

      - name: Verify Android build environment
        run: npm run android:preflight

      - name: Run unit tests
        run: npm test

      - name: Run static analysis
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Validate immutable release model catalog
        run: npm run catalog:validate-release

      - name: Verify model source ranges and GGUF headers
        run: npm run catalog:verify-sources

      - name: Build web assets
        run: npm run build

      - name: Report web bundle size
        shell: bash
        run: |
          echo "dist total: $(du -sh dist | cut -f1)"
          find dist -name '*.map' -print -quit | grep -q . \
            && { echo "::error::source maps must not ship in dist"; exit 1; } || true
          du -ah dist/assets | sort -h | tail -8

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build direct llama.cpp Android APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon --no-parallel --max-workers=2 --stacktrace

      - name: Verify APK artifact
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      # The size contract: unzip the APK and measure what actually lands on the
      # device. Fails the build rather than shipping something oversized.
      # The size contract: unzip the APK and measure what actually lands on the
      # device. Fails the build rather than shipping something oversized.
      - name: Enforce unpacked APK size budget
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          LIMIT_MIB="${APK_UNPACKED_LIMIT_MIB}"
          LIMIT_BYTES=$(( LIMIT_MIB * 1024 * 1024 ))

          # Materialise the listing once; piping unzip straight into head closes
          # the pipe early and trips pipefail.
          unzip -l "$APK_PATH" > /tmp/apk-listing.txt

          COMPRESSED_BYTES=$(stat -c%s "$APK_PATH")
          UNPACKED_BYTES=$(tail -1 /tmp/apk-listing.txt | awk '{print $1}')

          # Entry rows only: everything between the two dashed separator lines.
          # Names can contain spaces, so take field 1 as the size and fields 4+
          # as the name rather than assuming a date format.
          awk '/^---------/{sep++; next} sep==1 && $1 ~ /^[0-9]+$/ {
                 name=$4; for (i=5; i<=NF; i++) name=name" "$i;
                 printf "%s\t%s\n", $1, name }' \
            /tmp/apk-listing.txt | sort -rn > /tmp/apk-entries.txt

          mib() { awk -v b="$1" 'BEGIN{printf "%.2f", b/1048576}'; }
          top10() { head -10 /tmp/apk-entries.txt | awk -F'\t' '{printf "%8.2f MiB  %s\n", $1/1048576, $2}'; }

          {
            echo "### APK size"
            echo ""
            echo "| Measurement | Size |"
            echo "|---|---|"
            echo "| Download (compressed) | $(mib "$COMPRESSED_BYTES") MiB |"
            echo "| Installed (unpacked) | $(mib "$UNPACKED_BYTES") MiB |"
            echo "| Budget (unpacked) | ${LIMIT_MIB}.00 MiB |"
            echo ""
            echo "#### Ten largest entries"
            echo ""
            echo '```'
            top10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "compressed: $(mib "$COMPRESSED_BYTES") MiB"
          echo "unpacked:   $(mib "$UNPACKED_BYTES") MiB (budget ${LIMIT_MIB} MiB)"
          top10

          if [ "$UNPACKED_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::Unpacked APK is $(mib "$UNPACKED_BYTES") MiB, over the ${LIMIT_MIB} MiB budget."
            exit 1
          fi
          echo "Within budget: $(mib "$UNPACKED_BYTES") / ${LIMIT_MIB} MiB unpacked."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
